# Bomvakt agent config. Kept by `install.sh uninstall`, removed by `purge`.
# After a change: sudo systemctl restart bomvakt

[bomvakt]
# The domain (or IP address) these logs belong to. `bomvakt setup` fills it in.
domain =

# Access logs to follow, comma-separated. Their lines are sent as `domain`.
# Apache on Debian/Ubuntu: /var/log/apache2/access.log
# Apache on RHEL/Alma/Rocky: /var/log/httpd/access_log
logs = /var/log/nginx/access.log

# Seconds between summaries in the journal (minimum 10).
interval = 300

# Where to send. Leave as is.
server = https://bomvakt.com

# One log per site? List each with its own domain instead (add the domains
# first: sudo bomvakt add-domain shop.example.com):
#
# [logs]
# /var/log/nginx/shop.access.log = shop.example.com
# /var/log/nginx/blog.access.log = blog.example.com
